<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7f5" />
    <meta name="description" content="Backline — client feedback, anchored to the work." />
    <title>Backline</title>
    <script>
      // Apply the stored theme to <html> before first paint, so there's no flash of
      // the wrong theme while main.tsx/useTheme() (src/lib/use-theme.ts) load. Keep this
      // resolution logic in sync with that hook by hand - this has to run standalone,
      // before any module is available to import from.
      (function () {
        try {
          var stored = localStorage.getItem("backline_theme");
          var dark = stored === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').setAttribute(
            "content",
            dark ? "#0e1210" : "#f4f7f5"
          );
        } catch (e) {
          /* localStorage unavailable (privacy mode etc.) - fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
