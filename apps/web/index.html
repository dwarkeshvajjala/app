<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Tool</title>
    <script>
      // Apply the stored/OS theme to <html> before first paint, so there's no flash of
      // the wrong theme while main.tsx/useTheme() (src/lib/use-theme.ts) load. Keep this
      // resolution logic in sync with that hook by hand - this has to run standalone,
      // before any module is available to import from.
      (function () {
        try {
          var stored = localStorage.getItem("backline_theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* localStorage unavailable (privacy mode etc.) - fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
