packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true

# CI audits transitive tooling dependencies. Keep these constrained to patched
# releases until their direct parents publish lockfile-compatible updates.
overrides:
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4"
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  "browserslist@<=4.28.6": "4.28.7"
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  "nanoid@<3.3.18": "3.3.18"
  "postcss@<=8.5.22": "8.5.23"
